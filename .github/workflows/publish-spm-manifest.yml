name: Publish SPM Manifest

on:
  release:
    types: [published]

permissions:
  contents: write

# Prevent concurrent runs for the same release tag to avoid race conditions.
concurrency:
  group: spm-manifest-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    # Only run for version tags (e.g. v4.0.0, v5.1.2-rc.1)
    if: startsWith(github.event.release.tag_name, 'v')

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render Package.swift from release assets
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Downloading release assets for tag: $TAG"
          mkdir -p assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.xcframework.zip' \
            --dir assets

          DRAGON_ZIP="assets/DragonCopilotTurnkey.xcframework.zip"
          SPEECH_ZIP="assets/MicrosoftCognitiveServicesSpeech.xcframework.zip"

          # Validate that both required assets are present
          for f in "$DRAGON_ZIP" "$SPEECH_ZIP"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required asset missing: $f"
              echo "Available assets:"
              ls -la assets/
              exit 1
            fi
          done

          echo "Computing checksums..."
          DRAGON_SUM="$(sha256sum "$DRAGON_ZIP" | awk '{print $1}')"
          SPEECH_SUM="$(sha256sum "$SPEECH_ZIP" | awk '{print $1}')"
          echo "DragonCopilotTurnkey checksum:          $DRAGON_SUM"
          echo "MicrosoftCognitiveServicesSpeech checksum: $SPEECH_SUM"

          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          echo "Rendering Package.swift from template..."
          sed \
            -e "s|__RELEASE_BASE__|$BASE|g" \
            -e "s|__CHECKSUM_DRAGON__|$DRAGON_SUM|g" \
            -e "s|__CHECKSUM_SPEECH__|$SPEECH_SUM|g" \
            .github/templates/Package.swift.tmpl > Package.swift

          rm -rf assets
          echo "Generated Package.swift:"
          cat Package.swift

      - name: Commit manifest and keep same release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          echo "Finalizing release tag: $TAG"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Package.swift
          if git diff --cached --quiet; then
            echo "Package.swift unchanged — no new commit needed."
          else
            git commit -m "Release $TAG — update SPM manifest"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Package.swift committed and pushed to ${GITHUB_REF_NAME}."
          fi

          # Force-update the SAME tag (e.g. v4.0.0) — no new tag name.
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

          echo "Tag preserved and finalized as: $TAG"
